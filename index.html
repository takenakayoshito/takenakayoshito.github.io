<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>takenakayoshito</title>
<style>
  * {
    margin: 0;
    padding: 0;
  }
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    max-width: 20em;
    margin: 6rem auto;
    color: #202020;
    line-height: 2.0;
  }
  header {
    margin-bottom: 6rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 2rem;
  }
  article {
    margin-bottom: 4rem;
  }
  article::after {
    content: "";
    display: block;
    width: 0.5em;
    height: 1px;
    background: #c0c0c0;
    margin-top: 4rem;
  }
  article time {
    display: block;
    color: #202020;
  }
  article .note {
    color: #202020;
  }
  article a {
    color: #202020;
  }
</style>
</head>
<body>
  <header>
    <h1>takenakayoshito</h1>
    <p>2019.06.19からの社内共有メモを、こっちにまとめていく。</p>
  </header>

 <main id="feed"></main>

<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // memo.txt 内の [表示テキスト](URL) を a タグに変換（1件に複数でも可）
  function links(s){
    return s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>');
  }

  function toDatetime(d){ return d.replace(/\./g, "-"); }

  function render(blocks){
    const feed = document.getElementById("feed");
    feed.innerHTML = blocks.map(b => {
      const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
      if(!lines.length) return "";
      const date = lines[0].replace(/^MEMO[：:]\s*/, "");
      const body = lines.slice(1).map(ln => {
        const html = links(esc(ln));
        return ln.charAt(0) === "※"
          ? '<span class="note">' + html + '</span>'
          : '<p>' + html + '</p>';
      }).join("\n");
      return '<article><time datetime="' + esc(toDatetime(date)) + '">' + esc(date) + '</time>'
             + body + '</article>';
    }).join("\n");
  }

  fetch("memo.txt", {cache:"no-cache"})
    .then(r => { if(!r.ok) throw new Error(); return r.text(); })
    .then(t => render(t.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean)))
    .catch(() => {
      document.getElementById("feed").innerHTML =
        "<p>一覧を読み込めませんでした。公開URL（GitHub Pages）では表示されます。</p>";
    });
</script>
</body>
</html>
