<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>takenakayoshito</title>
<meta name="description" content="2019.06.19からの社内共有メモを、こっちにまとめていく。">
<style>
:root{
  --bg:#ffffff;
  --ink:#202020;        /* 近黒（ハーフスケール寄りの濃グレー） */
  --ink-weak:#808080;   /* 日付など */
  --ink-faint:#b8b8b8;
  --band:#e7e8ea;       /* グラデーション帯の中間色 */
  --line:#ededed;

  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Yu Gothic UI",Meiryo,sans-serif;
  --pad:clamp(20px,6vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);
  font-size:16px;line-height:1.7;
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}

/* ── ヘッダ ─────────────────────── */
header{padding:clamp(40px,10vw,88px) 0 0}
h1{
  margin:0;font-size:clamp(26px,6vw,34px);font-weight:600;
  letter-spacing:-.01em;
}
.lede{
  margin:1em 0 0;max-width:22em;
  color:var(--ink-weak);font-size:15px;line-height:1.85;
}

/* ── グラデーションの区切り ─────────── */
.rule{
  height:clamp(64px,12vw,96px);
  margin:clamp(28px,6vw,48px) 0 0;
  background:linear-gradient(to bottom,var(--bg) 0%,var(--band) 52%,var(--bg) 100%);
}

/* ── フィード ───────────────────── */
main{padding:0 0 120px}
.entry{padding:clamp(18px,4vw,26px) 0}
.entry + .entry{border-top:1px solid var(--line)}
.date{
  font-size:13px;color:var(--ink-weak);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  margin-bottom:5px;
}
.text{margin:0;font-size:17px;line-height:1.75;word-break:break-word}
.text a{
  color:var(--ink);
  text-decoration:underline;
  text-decoration-color:var(--ink-faint);
  text-underline-offset:3px;
  text-decoration-thickness:1px;
}
.text a:hover{text-decoration-color:var(--ink)}

.status{padding:40px 0 120px;color:var(--ink-weak);font-size:14px;line-height:1.9}
.status code{background:#f2f2f2;padding:1px 5px;border-radius:3px;font-size:13px}

footer{
  border-top:1px solid var(--line);padding:22px 0 60px;
  color:var(--ink-faint);font-size:12px;
  font-variant-numeric:tabular-nums;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>takenakayoshito</h1>
    <p class="lede">2019.06.19からの社内共有メモを、こっちにまとめていく。</p>
  </header>

  <div class="rule" aria-hidden="true"></div>

  <main id="feed">
    <div class="status" id="status">読み込み中…</div>
  </main>

  <footer id="foot"></footer>
</div>

<script>
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseBlock(b){
  const lines = b.split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return null;
  const date = lines[0].replace(/^MEMO[：:]\s*/,"").trim();
  let rest = lines.slice(1);
  let url = "";
  const ui = rest.findIndex(l=>/^https?:\/\//.test(l));
  if(ui >= 0){ url = rest[ui]; rest = rest.filter((_,i)=>i!==ui); }
  const comment = rest.join("\n");   // エントリー内の改行は保持する
  const m = date.match(/^(\d{4})\.(\d{2})(?:\.(\d{2}))?/);
  const key = m ? m[1]+m[2]+(m[3]||"00") : "00000000";
  if(!comment && !url) return null;
  return { date, comment, url, key };
}

// リンクのルール：
//   [ ]（半角）／［ ］（全角）で囲んだ語があれば、そこだけリンク（括弧は表示では消える）
//   無ければ、本文まるごとをリンク／URLが無ければ ただのテキスト
//   「」はただの引用符（リンクには関与しない）。改行は保持。
function linkify(comment, url){
  let c = esc(comment);
  const link = t => url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+t+'</a>' : t;
  const pin = c.match(/[\[［]([^\]］]+)[\]］]/);
  if(pin){
    c = c.slice(0, pin.index) + link(pin[1]) + c.slice(pin.index + pin[0].length);
  }else if(url){
    c = link(c);
  }
  return c.replace(/\n/g, "<br>");   // 保持した改行を表示上の改行に
}

function render(entries){
  const feed = document.getElementById("feed");
  if(!entries.length){
    document.getElementById("status").textContent = "まだ投稿がありません。";
    return;
  }
  feed.innerHTML = entries.map(e =>
    '<article class="entry">'
    + '<div class="date">'+esc(e.date)+'</div>'
    + '<p class="text">'+linkify(e.comment, e.url)+'</p>'
    + '</article>'
  ).join("");
  document.getElementById("foot").textContent = entries.length.toLocaleString() + " 件";
}

async function load(){
  try{
    const res = await fetch("memo.txt", {cache:"no-cache"});
    if(!res.ok) throw new Error("not ok");
    const txt = await res.text();
    const entries = txt.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean)
                       .map(parseBlock).filter(Boolean)
                       .sort((a,b)=> a.key<b.key?1 : a.key>b.key?-1 : 0);
    render(entries);
  }catch(err){
    document.getElementById("status").innerHTML =
      "一覧を読み込めませんでした。<br>公開URL（GitHub Pages）では表示されます。"
      + "ローカルで確認するだけなら <code>memo.txt</code> を同じ場所に置いてサーバー経由で開いてください。";
  }
}
load();
</script>
</body>
</html>
