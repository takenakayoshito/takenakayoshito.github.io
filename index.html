<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>takenakayoshito</title>
<style>
  * {
    margin: 0;
    padding: 0;
  }
  :root {
    --bg: #ffffff;   /* 背景 */
    --fg: #202020;   /* 文字 */
    --rule: #c0c0c0; /* 区切り線 */
    --band: #f6f6f6; /* 上部グラデ帯の濃い側 */
  }
  html {
    background-color: var(--bg);
    transition: background-color .7s ease;   /* ← 背景フェードの速さ */
  }
  @media (prefers-reduced-motion: reduce){
    html, body { transition: none; }
  }
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    max-width: 20em;
    margin: 12rem auto;
    color: var(--fg);
    line-height: 2.0;
    transition: color .7s ease;
  }
  header {
    margin-bottom: 12rem;          /* リード → 帯の上端：12rem の白 */
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 1rem;
  }
  article {
    margin-bottom: 4rem;
  }
  article::after {
    content: "";
    display: block;
    width: 0.5em;
    height: 1px;
    background: var(--rule);
    margin-top: 4rem;
  }
  article time {
    display: block;
    color: inherit;
  }
  article .note {
    color: inherit;
  }
  article a {
    color: inherit;
    text-decoration-color: #a0ff00;
    text-decoration-thickness: 1px;   /* ← 線の太さ（高さ）*/
    text-underline-offset: 4px;       /* ← 線の位置（文字からの距離・下げる）*/
  }
  main {
    display: block;
    position: relative;
    padding-top: 6rem;            /* 帯の上端 → 最初の投稿：6rem */
  }
  main::before {                  /* 全幅のグラデーション帯 */
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;                 /* 画面いっぱいの幅 */
    height: 200px;                /* 帯の高さ（フェードの長さ）*/
    background: linear-gradient(180deg, var(--band) 0%, var(--bg) 100%);
    z-index: -1;                  /* 文字の背後 */
  }
  .count {
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.025em;
    font-variant-numeric: tabular-nums;   /* 数字の桁幅を固定 */
    color: var(--fg);
  }
</style>
</head>
<body>
  <header>
    <h1>takenakayoshito</h1>
    <p>2019.06.19からの社内共有メモを、こっちにまとめていく。</p>
    <p class="count"><span id="memo-count">00000000</span></p>
  </header>

 <main id="feed"></main>

<script>
  // 8桁ゼロ埋めの件数を、半角英数（0-9・A-Z）でスクランブル→左から着地。4秒ごとに1回転
  function animateCount(target){
    const el = document.getElementById("memo-count");
    if(!el) return;
    const text  = String(target).padStart(8, "0");      // 例: 00000067
    const CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"; // 半角英数
    const len = text.length;                            // 8
    const duration = 1600;                              // 1回転の回る時間（ms）
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = text; return; }

    let raf = 0;
    function run(){
      cancelAnimationFrame(raf);
      const start = performance.now();
      let lastSwap = 0, cache = text;
      (function frame(now){
        const p = Math.min((now - start) / duration, 1);
        const locked = Math.floor(p * len);             // 左の桁から確定
        if(now - lastSwap > 32 || p >= 1){              // 切り替わる速さ（ms）
          lastSwap = now;
          let out = "";
          for(let i=0;i<len;i++) out += (i < locked) ? text[i] : CHARS[Math.floor(Math.random()*CHARS.length)];
          cache = out;
        }
        el.textContent = (p >= 1) ? text : cache;
        if(p < 1) raf = requestAnimationFrame(frame);
      })(start);
    }
    run();
    setInterval(run, 4000);                             // 4秒ごとに回す
  }

  // 月ごとの背景色ローテーション（偶数月=白 / 奇数月=黒。1〜12で自由に変更可）
  const MONTH_BG = {
    1:"#101010",  2:"#ffffff",  3:"#101010",  4:"#ffffff",
    5:"#101010",  6:"#ffffff",  7:"#101010",  8:"#ffffff",
    9:"#101010", 10:"#ffffff", 11:"#101010", 12:"#ffffff"
  };
  function isLight(hex){
    const c=hex.replace("#",""); const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
    return (0.2126*r + 0.7152*g + 0.0722*b) > 140;   // 明るい背景か
  }
  function applyTheme(month){
    const bg = MONTH_BG[month] || "#ffffff";
    const light = isLight(bg);
    const st = document.documentElement.style;
    st.setProperty("--bg", bg);
    st.setProperty("--fg", light ? "#202020" : "#f0f0f0");  // 文字色（濃淡を自動反転）
    st.setProperty("--band", light ? "#f6f6f6" : "#1c1c1c");
  }
  function monthOf(article){
    const t=article.querySelector("time"); const d=t&&t.getAttribute("datetime");
    return d ? parseInt(d.split("-")[1],10) : null;      // YYYY-MM-DD の MM
  }
  function initBackgroundFade(){
    const arts=[...document.querySelectorAll("article")];
    if(!arts.length) return;
    applyTheme(monthOf(arts[0]));                         // 初期＝最新月
    const io=new IntersectionObserver((es)=>{
      es.forEach(e=>{ if(e.isIntersecting){ const m=monthOf(e.target); if(m) applyTheme(m); } });
    }, { rootMargin: "-50% 0px -50% 0px" });              // ビューポート中央の“線”を横切った記事で切替
    arts.forEach(a=>io.observe(a));
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const isUrl = s => /^https?:\/\/\S+$/.test(s);
  const INLINE = /\[[^\]]+\]\((https?:\/\/[^)\s]+)\)/;

  // [表示テキスト](URL) を a タグに（1件に複数でも可）
  function mdLinks(s){
    return s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (m, t, u) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + t + '</a>');
  }

  function toDatetime(d){ return d.replace(/\./g, "-"); }

  function render(blocks){
    const feed = document.getElementById("feed");
    feed.innerHTML = blocks.map(b => {
      const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
      if(!lines.length) return "";
      const date = lines[0].replace(/^MEMO[：:]\s*/, "");
      const rest = lines.slice(1);

      const bareUrl = rest.find(isUrl) || "";     // 単独で置かれたURL（＝この投稿のリンク先）
      const textLines = rest.filter(l => !isUrl(l)); // 本文（URL単独行は表示から外す）
      const hasInline = INLINE.test(b);

      const body = textLines.map(ln => {
        const isNote = ln.charAt(0) === "※";
        let html;
        if (hasInline) {
          html = mdLinks(esc(ln));                 // [語](URL) を優先
        } else if (bareUrl && !isNote) {
          html = '<a href="' + esc(bareUrl) + '" target="_blank" rel="noopener">' + esc(ln) + '</a>'; // 本文まるごとリンク
        } else {
          html = mdLinks(esc(ln));
        }
        return isNote ? '<span class="note">' + html + '</span>' : '<p>' + html + '</p>';
      }).join("\n");

      return '<article><time datetime="' + esc(toDatetime(date)) + '">' + esc(date) + '</time>'
             + body + '</article>';
    }).join("\n");
  }

  fetch("memo.txt", {cache:"no-cache"})
    .then(r => { if(!r.ok) throw new Error(); return r.text(); })
    .then(t => {
      const blocks = t.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      render(blocks);
      animateCount(blocks.length);
      initBackgroundFade();
    })
    .catch(() => {
      document.getElementById("feed").innerHTML =
        "<p>一覧を読み込めませんでした。公開URL（GitHub Pages）では表示されます。</p>";
    });
</script>
</body>
</html>
