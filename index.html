<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  * {
    margin: 0;
    padding: 0;
  }
  html {
    overflow-x: hidden;            /* 100vw帯による横スクロールを予防 */
  }
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    max-width: 20em;
    margin: 12rem auto;
    color: #202020;
    line-height: 2.0;
  }
  header {
    margin-bottom: 12rem;          /* リード → 帯の上端：12rem の白 */
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 1rem;
  }
  article {
    margin-bottom: 4rem;
  }
  article::after {
    content: "";
    display: block;
    width: 0.5em;
    height: 1px;
    background: #c0c0c0;
    margin-top: 4rem;
  }
  article time {
    display: block;
    color: #202020;
  }
  article .note {
    color: #202020;
  }
  article a {
    color: #202020;
    text-decoration-color: #a0ff00;
    text-decoration-thickness: 1px;   /* ← 線の太さ（高さ）*/
    text-underline-offset: 4px;       /* ← 線の位置（文字からの距離・下げる）*/
  }
  main {
    display: block;
    position: relative;
    padding-top: 6rem;            /* 帯の上端 → 最初の投稿：6rem */
  }
  main::before {                  /* 全幅のグラデーション帯 */
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;                 /* 画面いっぱいの幅 */
    height: 200px;                /* 帯の高さ（フェードの長さ）*/
    background: linear-gradient(180deg, #f8f8f8 0%, #ffffff 100%);
    z-index: -1;                  /* 文字の背後 */
  }
  .count {
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.025em;
    font-variant-numeric: tabular-nums;   /* 数字の桁幅を固定 */
    color: #202020;
  }
  .count--bottom {
    margin-top: 4rem;              /* 区切り線 → 下カウンター：4rem（投稿リズムと統一）*/
    /* 下カウンター → ページ最下部は body の margin-bottom 12rem をそのまま使用（×=12rem）*/
  }
  /* スクロールで要素がふわっとフェードイン */
  .reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    will-change: opacity, transform;
  }
  .reveal.is-visible {
    opacity: 1;
    transform: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }
  /* ページ上部へ戻るボタン */
  #to-top {
    position: fixed;
    right: 1.5rem;
    bottom: 1.5rem;
    width: 2.75rem;
    height: 2.75rem;
    display: grid;
    place-items: center;
    border: 1px solid #c0c0c0;
    border-radius: 50%;
    background: #ffffff;
    color: #202020;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #to-top.is-visible { opacity: 1; visibility: visible; }
  #to-top:hover { border-color: #202020; }
  /* ハンバーガー / ドロワー（年ナビ）*/
  #menu-btn {
    position: fixed; top: 1.5rem; right: 1.5rem; z-index: 40;
    width: 2.75rem; height: 2.75rem; display: grid; place-items: center;
    background: #ffffff; border: 1px solid #c0c0c0; border-radius: 50%;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #menu-btn .bar { display: block; width: 1.1rem; height: 1px; background: #202020;
    transition: transform .3s ease, opacity .2s ease; }
  #menu-btn .bar + .bar { margin-top: 5px; }
  #menu-btn[aria-expanded="true"] .bar:nth-child(1){ transform: translateY(6px) rotate(45deg); }
  #menu-btn[aria-expanded="true"] .bar:nth-child(2){ opacity: 0; }
  #menu-btn[aria-expanded="true"] .bar:nth-child(3){ transform: translateY(-6px) rotate(-45deg); }
  #overlay {
    position: fixed; inset: 0; background: rgba(32,32,32,0.25); z-index: 30;
    opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s ease;
  }
  #overlay.is-open { opacity: 1; visibility: visible; }
  #drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(76vw, 15rem);
    background: #ffffff; z-index: 35; padding: 5rem 2rem 2rem;
    transform: translateX(100%); transition: transform .35s ease;
    box-shadow: -1px 0 0 #eeeeee;
  }
  #drawer.is-open { transform: translateX(0); }
  #year-nav { display: flex; flex-direction: column; gap: 1.5rem; }
  #year-nav a {
    font-size: 1.25rem; color: #202020; text-decoration: none;
    font-variant-numeric: tabular-nums; width: max-content;
  }
  #year-nav .brand {
    font-weight: 600;
    margin-bottom: 1rem;          /* 年リストと少し離す */
  }
  #year-nav a:hover { text-decoration: underline; text-decoration-color: #a0ff00; text-underline-offset: 4px; }
  article[id^="year-"] { scroll-margin-top: 2rem; }
  @media (prefers-reduced-motion: reduce) {
    #drawer, #overlay, #menu-btn .bar { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>takenakayoshito</h1>
    <p>2019.06.19からの社内共有メモを、こっちにまとめていく。</p>
    <p class="count"><span class="js-count" aria-live="off">00000000</span></p>
  </header>

 <main id="feed"></main>

  <footer class="count count--bottom reveal"><span class="js-count" aria-hidden="true">00000000</span></footer>

<button id="menu-btn" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">
  <span class="bar"></span><span class="bar"></span><span class="bar"></span>
</button>
<div id="overlay"></div>
<aside id="drawer" aria-hidden="true" aria-label="年で移動">
  <nav id="year-nav"></nav>
</aside>

<button id="to-top" type="button" aria-label="ページ上部へ戻る">↑</button>

<script>
  // 8桁ゼロ埋めの件数を、半角英数（0-9・A-Z）でスクランブル→左から着地。4秒ごとに1回転
  function animateCount(target){
    const els = [...document.querySelectorAll(".js-count")];
    if(!els.length) return;
    const text  = String(target).padStart(8, "0");      // 例: 00000126
    const CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"; // 半角英数
    const len = text.length;                            // 8
    const duration = 1600;                              // 1回転の回る時間（ms）
    els.forEach(el => { if(!el.hasAttribute("aria-hidden")) el.setAttribute("aria-label", "メモ " + target + "件"); });
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){ els.forEach(el => el.textContent = text); return; }

    let raf = 0;
    function run(){
      cancelAnimationFrame(raf);
      const start = performance.now();
      let lastSwap = 0, cache = text;
      (function frame(now){
        const p = Math.min((now - start) / duration, 1);
        const locked = Math.floor(p * len);             // 左の桁から確定
        if(now - lastSwap > 32 || p >= 1){              // 切り替わる速さ（ms）
          lastSwap = now;
          let out = "";
          for(let i=0;i<len;i++) out += (i < locked) ? text[i] : CHARS[Math.floor(Math.random()*CHARS.length)];
          cache = out;
        }
        const val = (p >= 1) ? text : cache;
        for(const el of els) el.textContent = val;      // 上下を同じ値で同期
        if(p < 1) raf = requestAnimationFrame(frame);
      })(start);
    }
    run();
    setInterval(run, 4000);                             // 4秒ごとに回す
  }

  // 画面に入った .reveal をふわっと表示（1度だけ）
  function setupReveal(){
    const items = document.querySelectorAll(".reveal");
    if(!items.length) return;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)){
      items.forEach(el => el.classList.add("is-visible"));
      return;
    }
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(e => {
        if(e.isIntersecting){ e.target.classList.add("is-visible"); obs.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -10% 0px", threshold: 0.05 });
    items.forEach(el => io.observe(el));
  }

  // 年ナビを日付から自動生成
  function buildYearNav(years){
    const nav = document.getElementById("year-nav");
    if(!nav) return;
    nav.innerHTML =
      '<a href="/" class="brand" data-top>takenakayoshito</a>' +
      years.map(y =>
        '<a href="#year-' + y + '" data-target="year-' + y + '">' + y + '</a>').join("");
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const isUrl = s => /^https?:\/\/\S+$/.test(s);
  const INLINE = /\[[^\]]+\]\((https?:\/\/[^)\s]+)\)/;

  // [表示テキスト](URL) を a タグに（1件に複数でも可）
  function mdLinks(s){
    return s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (m, t, u) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + t + '</a>');
  }

  function toDatetime(d){ return d.replace(/\./g, "-"); }

  function render(blocks){
    const feed = document.getElementById("feed");
    const years = [];
    let prevYear = null;
    const html = blocks.map(b => {
      const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
      if(!lines.length) return "";
      const date = lines[0].replace(/^MEMO[：:]\s*/, "");
      const rest = lines.slice(1);

      const bareUrl = rest.find(isUrl) || "";     // 単独で置かれたURL（＝この投稿のリンク先）
      const textLines = rest.filter(l => !isUrl(l)); // 本文（URL単独行は表示から外す）
      const hasInline = INLINE.test(b);

      const body = textLines.map(ln => {
        const isNote = ln.charAt(0) === "※";
        let html;
        if (hasInline) {
          html = mdLinks(esc(ln));                 // [語](URL) を優先
        } else if (bareUrl && !isNote) {
          html = '<a href="' + esc(bareUrl) + '" target="_blank" rel="noopener">' + esc(ln) + '</a>'; // 本文まるごとリンク
        } else {
          html = mdLinks(esc(ln));
        }
        return isNote ? '<span class="note">' + html + '</span>' : '<p>' + html + '</p>';
      }).join("\n");

      const year = (date.match(/^(\d{4})/) || [])[1] || "";
      let idAttr = "";
      if(year && year !== prevYear){ idAttr = ' id="year-' + year + '"'; years.push(year); prevYear = year; }
      return '<article class="reveal"' + idAttr + '><time datetime="' + esc(toDatetime(date)) + '">' + esc(date) + '</time>'
             + body + '</article>';
    }).join("\n");
    feed.innerHTML = html;
    return years;
  }

  // ハンバーガー / ドロワー
  (function(){
    const btn = document.getElementById("menu-btn");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    const nav = document.getElementById("year-nav");
    if(!btn || !drawer || !overlay) return;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function open(){
      btn.setAttribute("aria-expanded","true");
      drawer.classList.add("is-open"); overlay.classList.add("is-open");
      drawer.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }
    function close(){
      btn.setAttribute("aria-expanded","false");
      drawer.classList.remove("is-open"); overlay.classList.remove("is-open");
      drawer.setAttribute("aria-hidden","true");
      document.body.style.overflow = "";
    }
    btn.addEventListener("click", () => btn.getAttribute("aria-expanded")==="true" ? close() : open());
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", e => { if(e.key==="Escape") close(); });
    nav.addEventListener("click", e => {
      const a = e.target.closest("a"); if(!a) return;
      e.preventDefault(); close();
      if(a.hasAttribute("data-top")){
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });  // リロードせず上へ
        return;
      }
      const t = document.getElementById(a.dataset.target);
      if(t) t.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    });
  })();

  // ページ上部へ戻る
  (function(){
    const btn = document.getElementById("to-top");
    if(!btn) return;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let ticking = false;
    function onScroll(){
      if(ticking) return; ticking = true;
      requestAnimationFrame(() => {
        btn.classList.toggle("is-visible", window.scrollY > window.innerHeight);
        ticking = false;
      });
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    btn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });
  })();

  fetch("memo.txt", {cache:"no-cache"})
    .then(r => { if(!r.ok) throw new Error(); return r.text(); })
    .then(t => {
      const blocks = t.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      const years = render(blocks);
      animateCount(blocks.length);
      setupReveal();
      buildYearNav(years);
    })
    .catch(() => {
      document.getElementById("feed").innerHTML =
        "<p>一覧を読み込めませんでした。公開URL（GitHub Pages）では表示されます。</p>";
    });
</script>
</body>
</html>
